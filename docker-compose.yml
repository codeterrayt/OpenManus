# docker-compose.yml
# Spins up PostgreSQL (required) + pgAdmin (optional DB GUI)
#
# Usage:
#   docker compose up -d          # start in background
#   docker compose down           # stop
#   docker compose down -v        # stop + wipe data volumes
#
# The schema.sql is mounted into /docker-entrypoint-initdb.d/ so Postgres
# creates all tables and seeds the built-in skills automatically on first start.

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: openmanus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       openmanus
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-runs schema.sql on first container creation
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openmanus"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── pgAdmin 4 (optional — web UI for the DB) ────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: openmanus-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@openmanus.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ── Neo4j Graph Database (Mem0 Knowledge Graph) ───────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: openmanus-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/openmanus_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: 256M
      NEO4J_dbms_memory_heap_initial__size: 256M
      NEO4J_dbms_memory_heap_max__size: 512M
    ports:
      - "7474:7474" # Neo4j Browser Web UI
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:   # persists DB data across restarts
  pgadmin_data:    # persists pgAdmin saved connections
  neo4j_data:      # persists Neo4j graph data across restarts
